name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package
        run: pnpm run verify

  publish:
    name: Publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          cache: true
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # Publishing and releasing happen only in the run of the commit that changes the
      # version, so a rerun of that run recovers it and later pushes never retag or
      # republish. Without published/released outputs, the steps below are skipped.
      - name: Resolve release state
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          git show HEAD^:package.json > "$RUNNER_TEMP/previous-package.json"
          previous_version="$(node -p 'require(process.argv[1]).version' "$RUNNER_TEMP/previous-package.json")"
          if [ "$previous_version" = "$version" ]; then
            echo "::notice::This commit keeps version $version; publish and release run only for the commit that changes it. Re-run that commit's workflow run to recover a failed release."
            exit 0
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if pnpm view "$name@$version" version "--config.${name%%/*}:registry=https://registry.npmjs.org/" > /dev/null 2> "$RUNNER_TEMP/pnpm-view.log"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$version is already on npm; publish is skipped."
          elif grep -qE 'ERR_PNPM_(FETCH_404|PACKAGE_NOT_FOUND)' "$RUNNER_TEMP/pnpm-view.log"; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/pnpm-view.log"
            echo "::error::Could not read $name@$version from the npm registry; see the pnpm output above."
            exit 1
          fi
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Release v$version already exists; nothing to release."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
      # npm trusted publishing: the id-token permission lets pnpm exchange the
      # workflow's OIDC token for a short-lived publish token, so no npm secret exists.
      - name: Publish to npm
        if: steps.release.outputs.published == 'false'
        run: pnpm publish --no-git-checks --provenance
      # npm serves package metadata through a CDN, so a version published seconds ago can
      # still be missing for several minutes. `pnpm add` reads the abbreviated document
      # first and `pnpm view` the full one, and the CDN caches them separately, so wait
      # until both list the version before verifying it, including on re-runs.
      - name: Wait for npm to serve the new version
        if: steps.release.outputs.released == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          name="$(node -p 'require("./package.json").name')"
          url="https://registry.npmjs.org/${name/\//%2f}"
          log="$RUNNER_TEMP/npm-propagation.log"
          for attempt in $(seq 1 20); do
            if pnpm view "$name@$VERSION" version "--config.${name%%/*}:registry=https://registry.npmjs.org/" > /dev/null 2> "$log" \
              && curl -fsS --max-time 30 -H 'Accept: application/vnd.npm.install-v1+json; q=1.0, application/json; q=0.8, */*' "$url" 2>> "$log" \
                | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { if (JSON.parse(s).versions?.[process.env.VERSION]) process.exit(0); console.error(`abbreviated npm document does not list ${process.env.VERSION} yet`); process.exit(1); })' 2>> "$log"; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then
              echo "$name@$VERSION is not served yet (attempt $attempt/20); retrying in 30 seconds."
              sleep 30
            fi
          done
          cat "$log"
          echo "::error::npm did not serve $name@$VERSION within 10 minutes; re-run this job after it appears."
          exit 1
      - name: Verify the published package
        if: steps.release.outputs.released == 'false'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: pnpm run verify:consumer -- --published "$VERSION"
      - name: Create GitHub Release
        if: steps.release.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
